name: Bug report / 缺陷报告
description: 提交能够复现的缺陷，帮助定位问题。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。请先查看 README 和现有 issue；安全问题请遵循 SECURITY.md，勿公开漏洞细节、密钥、个人信息或未脱敏数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 描述使用场景、受影响的功能，以及预期行为和实际行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 提供运行命令、必要的脱敏配置和可分享的输入。请勿附真实 .env 或 API 密钥。
      placeholder: |
        1. 使用的提交或版本：
        2. 运行命令：
        3. 触发问题的输入：
        4. 实际结果：
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 仅填写与复现有关的信息；无需提供账号或机器识别信息。
      placeholder: |
        操作系统：
        Python 版本：
        LongChain 提交或版本：
        相关依赖版本：
        模型提供方、模型名称及 Ollama 版本（如适用）：
        CPU/GPU 与内存（如适用）：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 仅提供定位所必需的内容；移除令牌、请求头、私有路径和敏感文档。
  - type: textarea
    id: attempts
    attributes:
      label: 已尝试的排查
      description: 可附相关 issue、临时解决方式或其他线索。
